---
- name: Add hosts to Zabbix server with active agents
  hosts: zabbix-server
  become: yes
  vars:
    zabbix_api_url: "http://localhost/api_jsonrpc.php"
    zabbix_admin_user: "Admin"
    zabbix_admin_password: "zabbix"

  tasks:
    - name: Get auth token
      uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        body:
          jsonrpc: "2.0"
          method: "user.login"
          params:
            user: "{{ zabbix_admin_user }}"
            password: "{{ zabbix_admin_password }}"
          id: 1
        body_format: json
        status_code: 200
        headers:
          Content-Type: "application/json"
      register: auth_result
      retries: 5
      delay: 10

    - name: Set auth token
      set_fact:
        zabbix_auth_token: "{{ auth_result.json.result }}"

    - name: Add hosts with active agent configuration
      uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        body:
          jsonrpc: "2.0"
          method: "host.create"
          params:
            host: "{{ item.name }}"
            interfaces:
              - type: 1
                main: 1
                useip: 0
                ip: ""
                dns: "{{ item.name }}"
                port: "10051"
            groups:
              - groupid: "2"  # Linux servers
            templates:
              - templateid: "10001"  # Template OS Linux
            inventory_mode: 0
          id: 2
          auth: "{{ zabbix_auth_token }}"
        body_format: json
        status_code: 200
        headers:
          Content-Type: "application/json"
      loop:
        - { name: "s1.ru-central1.internal" }
        - { name: "s2.ru-central1.internal" }
        - { name: "elastic.ru-central1.internal" }
        - { name: "kibana.ru-central1.internal" }
        - { name: "bastion" }
      retries: 3
      delay: 5