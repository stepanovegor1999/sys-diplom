---
- name: Настройка репозитория Elastic
  hosts: elasticsearch,kibana
  become: yes
  tasks:
    - name: Добавление репозитория Elastic
      apt_repository:
        repo: "deb [trusted=yes] https://mirror.yandex.ru/mirrors/elastic/8/ stable main"
        state: present

    - name: Обновление apt
      apt:
        update_cache: yes

# -------------------- Elasticsearch --------------------
- name: Установка и настройка Elasticsearch
  hosts: elasticsearch
  become: yes
  tasks:
    - name: Установка Elasticsearch
      apt:
        name: elasticsearch
        state: present
        update_cache: yes

    - name: Настройка конфигурации Elasticsearch
      copy:
        dest: /etc/elasticsearch/elasticsearch.yml
        content: |
          path.data: /var/lib/elasticsearch
          path.logs: /var/log/elasticsearch
          network.host: 127.0.0.1
          http.host: 0.0.0.0
          http.port: 9200
          discovery.type: single-node
          xpack.security.enabled: false

    - name: Перезапуск Elasticsearch
      systemd:
        name: elasticsearch
        state: restarted
        enabled: yes

    - name: Ожидание запуска Elasticsearch
      wait_for:
        host: 127.0.0.1
        port: 9200
        timeout: 120

    - name: Установка Filebeat
      apt:
        name: filebeat
        state: present
        update_cache: yes

    - name: Настройка Filebeat для отправки логов в Elasticsearch
      copy:
        dest: /etc/filebeat/filebeat.yml
        content: |
          filebeat.inputs:
          - type: log
            paths:
              - /var/log/elasticsearch/*.log

          output.elasticsearch:
            hosts: ["http://127.0.0.1:9200"]

      notify:
        - restart filebeat

    - name: Включение и запуск Filebeat
      systemd:
        name: filebeat
        state: started
        enabled: yes

  handlers:
    - name: restart filebeat
      systemd:
        name: filebeat
        state: restarted

# -------------------- Kibana --------------------
- name: Установка и настройка Kibana
  hosts: kibana
  become: yes
  vars:
    elastic_private_ip: "{{ hostvars['elastic']['ansible_host'] }}"
  tasks:
    - name: Установка Kibana
      apt:
        name: kibana
        state: present
        update_cache: yes

    - name: Настройка конфигурации Kibana
      copy:
        dest: /etc/kibana/kibana.yml
        content: |
          server.host: "0.0.0.0"
          server.name: kibana
          elasticsearch.hosts: ["http://{{ elastic_private_ip }}:9200"]

    - name: Перезапуск Kibana
      systemd:
        name: kibana
        state: restarted
        enabled: yes

    - name: Ожидание запуска Kibana
      wait_for:
        host: 0.0.0.0
        port: 5601
        timeout: 120

# -------------------- Открытие портов --------------------
- name: Настройка ufw для Elasticsearch и Kibana
  hosts: elasticsearch,kibana
  become: yes
  tasks:
    - name: Включение UFW
      ufw:
        state: enabled
        policy: allow

    - name: Открытие порта Elasticsearch 9200
      ufw:
        rule: allow
        port: 9200
        proto: tcp
      when: "'elasticsearch' in group_names"

    - name: Открытие порта Kibana 5601
      ufw:
        rule: allow
        port: 5601
        proto: tcp
      when: "'kibana' in group_names"
